[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-hydra-heygem"
version = "0.1.0"
description = "Hydra-owned ComfyUI nodes for managed HeyGem long-form avatar generation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Cyber Dick Lang" }]
keywords = ["comfyui", "heygem", "digital-human", "avatar", "hydramatrix"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/whmc76/ComfyUI-Hydra-HeyGem"
Issues = "https://github.com/whmc76/ComfyUI-Hydra-HeyGem/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["hydra_heygem*"]

[tool.comfy]
PublisherId = "whmc76"
DisplayName = "ComfyUI-Hydra-HeyGem"
requires-comfyui = ">=0.30.0"
includes = []
