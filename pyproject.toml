[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-hydra-inferworks"
version = "1.1.3"
description = "Unified HydraMatrix inference nodes for IndexTTS 2.5, Qwen3 ASR, forced alignment, and HeyGem in ComfyUI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Cyber Dick Lang" }]
keywords = ["comfyui", "hydramatrix", "indextts", "tts", "asr", "heygem", "avatar"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "accelerate>=1.8.1",
  "cn2an>=0.5.22",
  "descript-audiotools>=0.7.2",
  "einops>=0.8.1",
  "ffmpeg-python>=0.2.0",
  "fugashi>=1.2.0",
  "unidic-lite>=1.0.0",
  "g2p-en>=2.1.0",
  "jieba>=0.42.1",
  "json5>=0.10.0",
  "librosa>=0.10.2",
  "modelscope>=1.27.0",
  "munch>=4.0.0",
  "numba>=0.61.0",
  "numpy>=2.0,<2.3",
  "omegaconf>=2.3.0",
  "qwen-asr==0.0.6",
  "safetensors>=0.5.2",
  "sentencepiece>=0.2.1",
  "soundfile>=0.12.1",
  "textstat>=0.7.10",
  "openai-whisper>=20231117",
  "huggingface-hub>=0.30.0",
  "wetext>=0.0.9; platform_system!='Linux'",
  "WeTextProcessing>=1.0.3; platform_system=='Linux'",
]

[project.urls]
Repository = "https://github.com/whmc76/ComfyUI-Hydra-InferWorks"
Documentation = "https://github.com/whmc76/ComfyUI-Hydra-InferWorks#readme"
Issues = "https://github.com/whmc76/ComfyUI-Hydra-InferWorks/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["nodes", "tts_nodes", "asr_nodes", "heygem_nodes", "worker"]

[tool.setuptools.data-files]
"." = ["asr-model-attestations.v1.json", "inference-profiles.v1.json", "node-manifest.v1.json"]

[tool.setuptools.packages.find]
include = ["hydra_heygem*", "top_tts_vendor*"]

[tool.comfy]
PublisherId = "whmc76"
DisplayName = "Hydra InferWorks"
Icon = "https://raw.githubusercontent.com/whmc76/ComfyUI-Hydra-InferWorks/main/assets/icon.svg"
requires-comfyui = ">=0.30.0"
includes = ["asr-model-attestations.v1.json", "inference-profiles.v1.json", "node-manifest.v1.json"]
